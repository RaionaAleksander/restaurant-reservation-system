# Number of random reservations generated on application startup
reservation.generator.count=50

# Restaurant working hours
reservation.rules.open-time=09:30
reservation.rules.close-time=22:15

# Allowed reservation window (starting from tomorrow)
reservation.rules.days-ahead=7

# Minimum and maximum reservation duration
reservation.rules.min-duration=PT30M
reservation.rules.max-duration=PT2H

# PT30M	    - 30 minutes
# PT2H	    - 2 hours
# PT1H30M   - 1 hour 30 minutes

# -------------------------------
# Past reservations (for statistics)
# Number of past completed reservations generated on startup
reservation.generator.count-completed=50
# How many days in the past to consider when generating completed reservations
reservation.generator.past-days=12