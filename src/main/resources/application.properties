spring.application.name=reservation-system

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db
spring.datasource.username=restaurant_user
spring.datasource.password=restaurant123!

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Optional: show SQL
spring.jpa.show-sql=true

# Imports
spring.config.import=classpath:reservation.properties

# Pagination defaults for Spring Data
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false

# CORS origins
cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:5173